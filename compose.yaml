services:
  db:
    image: mysql:8.4
    restart: unless-stopped
    environment:
      MYSQL_DATABASE: shop
      MYSQL_USER: shop
      MYSQL_PASSWORD: ${DB_PASSWORD:?Set DB_PASSWORD in .env}
      MYSQL_ROOT_PASSWORD: ${MYSQL_ROOT_PASSWORD:?Set MYSQL_ROOT_PASSWORD in .env}
    volumes:
      - shop_data:/var/lib/mysql
    healthcheck:
      test: ["CMD-SHELL", "MYSQL_PWD=$$MYSQL_PASSWORD mysql -h 127.0.0.1 -u shop -D shop -e 'SELECT 1' >/dev/null 2>&1"]
      interval: 10s
      timeout: 5s
      retries: 20
  app:
    build: .
    restart: unless-stopped
    ports:
      - "127.0.0.1:8080:8080"
    environment:
      DB_URL: jdbc:mysql://db:3306/shop?connectionTimeZone=UTC
      DB_USER: shop
      DB_PASSWORD: ${DB_PASSWORD}
      SHOP_USERNAME: ${SHOP_USERNAME:-owner}
      SHOP_PASSWORD: ${SHOP_PASSWORD:?Set SHOP_PASSWORD in .env}
      SHOP_NAME: ${SHOP_NAME:-Naresh Mobile & Print}
      SHOP_ADDRESS: ${SHOP_ADDRESS:-Chennai}
      SHOP_PHONE: ${SHOP_PHONE:-}
    depends_on:
      db:
        condition: service_healthy
volumes:
  shop_data:
